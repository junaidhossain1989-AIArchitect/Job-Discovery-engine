name: Daily Job Discovery Pipeline

on:
  schedule:
    # Runs daily at 8:00 AM UTC (adjust cron for your timezone)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Job Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PROMPT_VERSION: 'v1.txt'
          FIT_SCORE_THRESHOLD: 70
        run: npx tsx discovery-engine/index.ts

      - name: Commit Updated Cache (processedJobs.json)
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add discovery-engine/processedJobs.json
          git commit -m "chore: update processed jobs cache [skip ci]" || exit 0
          git push
