name: Daily Job Discovery Pipeline

on:
  schedule:
    # Runs daily at 8:00 AM UTC (adjust cron for your timezone)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          if [ -d "discovery-engine" ]; then
            cd discovery-engine && (npm ci || npm install)
          fi

      - name: Run Job Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PROMPT_VERSION: 'v1.txt'
          FIT_SCORE_THRESHOLD: 70
        run: npx tsx discovery-engine/index.ts

      - name: Commit Updated Cache (processedJobs.json)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -f "discovery-engine/processedJobs.json" ]; then
            git add -f discovery-engine/processedJobs.json
            git diff --staged --quiet || git commit -m "chore: update processedJobs.json cache"
            git push
          else
            echo "Cache file not found, skipping commit."
          fi
